name: Publish container to GHCR

# Publishes the fork as a container image so it can be consumed without cloning
# the repo or running `npm install`. Runs on every push to main, on version tags,
# and on demand.
on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-ghcr-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish:
    name: Build and push image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read package version
        id: package
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.package.outputs.version }},enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=long
          labels: |
            org.opencontainers.image.title=Azure DevOps MCP Server (Gallagher fork)
            org.opencontainers.image.description=MCP server for Azure DevOps, forked to support on-premises Azure DevOps Server / TFS

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the published image
        timeout-minutes: 3
        run: |
          set -euo pipefail
          # Docker refs must be lowercase; the repository owner is not. docker/metadata-action
          # lowercases the tags it emits, so do the same when building a ref by hand.
          image="${{ env.REGISTRY }}/$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]'):sha-${{ github.sha }}"
          docker pull "$image"
          request='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"smoke","version":"1"}}}'
          output=$(printf '%s\n' "$request" | docker run -i --rm -e ADO_PAT=smoke-test "$image" https://ado.example.local/tfs/DefaultCollection --authentication pat)
          echo "$output"
          echo "$output" | grep -q '"serverInfo"'
